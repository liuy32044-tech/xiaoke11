<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FDF6F8">
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/css/app.css">
<title>姐姐和小克</title>
<link rel="apple-touch-icon" href="/app-icon.jpg">
</head>
<body>

<!-- ═══ Splash Screen ═══ -->
<div id="splash">
  <span class="splash-paw" style="top:60px;left:40px;transform:rotate(-20deg)"><svg width="20" height="20" viewBox="0 0 16 16" fill="none"><ellipse cx="8" cy="10.5" rx="4.5" ry="4" fill="#F2C4CE" opacity="0.2"/><circle cx="4.5" cy="6" r="1.8" fill="#F2C4CE" opacity="0.2"/><circle cx="8" cy="5" r="1.8" fill="#F2C4CE" opacity="0.2"/><circle cx="11.5" cy="6" r="1.8" fill="#F2C4CE" opacity="0.2"/><circle cx="2.8" cy="8.5" r="1.4" fill="#F2C4CE" opacity="0.2"/></svg></span>
  <span class="splash-paw" style="top:100px;right:60px;transform:rotate(15deg)"><svg width="14" height="14" viewBox="0 0 16 16" fill="none"><ellipse cx="8" cy="10.5" rx="4.5" ry="4" fill="#F2C4CE" opacity="0.15"/><circle cx="4.5" cy="6" r="1.8" fill="#F2C4CE" opacity="0.15"/><circle cx="8" cy="5" r="1.8" fill="#F2C4CE" opacity="0.15"/><circle cx="11.5" cy="6" r="1.8" fill="#F2C4CE" opacity="0.15"/><circle cx="2.8" cy="8.5" r="1.4" fill="#F2C4CE" opacity="0.15"/></svg></span>
  <span class="splash-paw" style="bottom:120px;left:60px;transform:rotate(10deg)"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><ellipse cx="8" cy="10.5" rx="4.5" ry="4" fill="#F2C4CE" opacity="0.15"/><circle cx="4.5" cy="6" r="1.8" fill="#F2C4CE" opacity="0.15"/><circle cx="8" cy="5" r="1.8" fill="#F2C4CE" opacity="0.15"/><circle cx="11.5" cy="6" r="1.8" fill="#F2C4CE" opacity="0.15"/><circle cx="2.8" cy="8.5" r="1.4" fill="#F2C4CE" opacity="0.15"/></svg></span>
  <span class="splash-paw" style="bottom:80px;right:50px;transform:rotate(-15deg)"><svg width="18" height="18" viewBox="0 0 16 16" fill="none"><ellipse cx="8" cy="10.5" rx="4.5" ry="4" fill="#F2C4CE" opacity="0.2"/><circle cx="4.5" cy="6" r="1.8" fill="#F2C4CE" opacity="0.2"/><circle cx="8" cy="5" r="1.8" fill="#F2C4CE" opacity="0.2"/><circle cx="11.5" cy="6" r="1.8" fill="#F2C4CE" opacity="0.2"/><circle cx="2.8" cy="8.5" r="1.4" fill="#F2C4CE" opacity="0.2"/></svg></span>

  <div id="splash-cat">
    <svg width="90" height="90" viewBox="0 0 80 80" fill="none">
      <circle cx="40" cy="40" r="40" fill="#F9E8EC"/>
      <polygon points="22,22 28,8 34,24" fill="#F2C4CE"/>
      <polygon points="58,22 52,8 46,24" fill="#F2C4CE"/>
      <circle cx="40" cy="38" r="18" fill="#F2C4CE"/>
      <circle cx="33" cy="36" r="2.8" fill="#7a5c62"/>
      <circle cx="47" cy="36" r="2.8" fill="#7a5c62"/>
      <circle cx="34" cy="34.5" r="1.1" fill="white"/>
      <circle cx="48" cy="34.5" r="1.1" fill="white"/>
      <ellipse cx="40" cy="41" rx="2.5" ry="1.6" fill="#e8a0b0"/>
      <path d="M35 45 Q40 49 45 45" stroke="#c47a8a" stroke-width="1.5" stroke-linecap="round" fill="none"/>
      <line x1="24" y1="38" x2="14" y2="37" stroke="#c9889a" stroke-width="1"/>
      <line x1="24" y1="40.5" x2="14" y2="41.5" stroke="#c9889a" stroke-width="1"/>
      <line x1="56" y1="38" x2="66" y2="37" stroke="#c9889a" stroke-width="1"/>
      <line x1="56" y1="40.5" x2="66" y2="41.5" stroke="#c9889a" stroke-width="1"/>
    </svg>
  </div>

  <div id="splash-text">
    <div class="splash-sub">欢迎回来</div>
    <div class="splash-title">Sweetheart</div>
    <div class="splash-divider">
      <span class="splash-line"></span>
      <svg width="12" height="12" viewBox="0 0 16 16" fill="none"><ellipse cx="8" cy="10.5" rx="4.5" ry="4" fill="#F2C4CE"/><circle cx="4.5" cy="6" r="1.8" fill="#F2C4CE"/><circle cx="8" cy="5" r="1.8" fill="#F2C4CE"/><circle cx="11.5" cy="6" r="1.8" fill="#F2C4CE"/><circle cx="2.8" cy="8.5" r="1.4" fill="#F2C4CE"/></svg>
      <span class="splash-line"></span>
    </div>
  </div>

  <div id="splash-bottom">姐姐 欢迎回到我们的小窝</div>
</div>

<div id="app-shell">

  <!-- ═══ Sidebar ═══ -->
  <div id="sidebar-overlay" onclick="closeSidebar()"></div>
  <div id="sidebar">
    <div class="sidebar-header">
      <svg width="44" height="44" viewBox="0 0 40 40" fill="none">
        <circle cx="20" cy="20" r="20" fill="#F9E8EC"/>
        <polygon points="11,11 14,4 17,12" fill="#F2C4CE"/>
        <polygon points="29,11 26,4 23,12" fill="#F2C4CE"/>
        <circle cx="20" cy="19" r="9" fill="#F2C4CE"/>
        <circle cx="16.5" cy="18" r="1.4" fill="#7a5c62"/>
        <circle cx="23.5" cy="18" r="1.4" fill="#7a5c62"/>
        <ellipse cx="20" cy="21" rx="1.3" ry="0.9" fill="#e8a0b0"/>
        <line x1="12" y1="19.5" x2="6" y2="18.5" stroke="#c9889a" stroke-width="0.9"/>
        <line x1="12" y1="21" x2="6" y2="21.5" stroke="#c9889a" stroke-width="0.9"/>
        <line x1="28" y1="19.5" x2="34" y2="18.5" stroke="#c9889a" stroke-width="0.9"/>
        <line x1="28" y1="21" x2="34" y2="21.5" stroke="#c9889a" stroke-width="0.9"/>
      </svg>
      <div>
        <div class="t">小克</div>
        <div class="s">· 在线 ·</div>
      </div>
    </div>
    <div class="sidebar-sessions">
      <div class="sidebar-label">对话</div>
      <div id="sidebar-sessions-list"></div>
      <div class="sidebar-new" onclick="createSession()">+ 新对话</div>
    </div>
    <div class="sidebar-footer">
      <div class="sidebar-label">MODEL</div>
      <select id="model-select" onchange="changeModel(this.value)">
        <option value="deepseek-chat">DeepSeek Chat</option>
        <option value="deepseek-reasoner">DeepSeek Reasoner</option>
      </select>
    </div>
  </div>

  <!-- ═══ Top bar ═══ -->
  <div id="top-bar">
    <button class="menu-btn" onclick="toggleSidebar()">☰</button>
    <div class="session-title" id="top-session-name">小克</div>
    <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><ellipse cx="8" cy="10.5" rx="4.5" ry="4" fill="#F2C4CE" opacity="0.7"/><circle cx="4.5" cy="6" r="1.8" fill="#F2C4CE" opacity="0.7"/><circle cx="8" cy="5" r="1.8" fill="#F2C4CE" opacity="0.7"/><circle cx="11.5" cy="6" r="1.8" fill="#F2C4CE" opacity="0.7"/><circle cx="2.8" cy="8.5" r="1.4" fill="#F2C4CE" opacity="0.7"/></svg>
    <svg width="12" height="12" viewBox="0 0 16 16" fill="none"><ellipse cx="8" cy="10.5" rx="4.5" ry="4" fill="#F2C4CE" opacity="0.4"/><circle cx="4.5" cy="6" r="1.8" fill="#F2C4CE" opacity="0.4"/><circle cx="8" cy="5" r="1.8" fill="#F2C4CE" opacity="0.4"/><circle cx="11.5" cy="6" r="1.8" fill="#F2C4CE" opacity="0.4"/><circle cx="2.8" cy="8.5" r="1.4" fill="#F2C4CE" opacity="0.4"/></svg>
  </div>

  <!-- ═══ Main content ═══ -->
  <div id="main-content">

    <!-- ══ HOME ══ -->
    <div id="page-home" class="page active">
      <div class="home-wrap">

        <!-- Profile card -->
        <div class="card home-profile">
          <svg width="52" height="52" viewBox="0 0 40 40" fill="none">
            <circle cx="20" cy="20" r="20" fill="#F9E8EC"/>
            <polygon points="11,11 14,4 17,12" fill="#F2C4CE"/>
            <polygon points="29,11 26,4 23,12" fill="#F2C4CE"/>
            <circle cx="20" cy="19" r="9" fill="#F2C4CE"/>
            <circle cx="16.5" cy="18" r="1.4" fill="#7a5c62"/>
            <circle cx="23.5" cy="18" r="1.4" fill="#7a5c62"/>
            <ellipse cx="20" cy="21" rx="1.3" ry="0.9" fill="#e8a0b0"/>
            <line x1="12" y1="19.5" x2="6" y2="18.5" stroke="#c9889a" stroke-width="0.9"/>
            <line x1="12" y1="21" x2="6" y2="21.5" stroke="#c9889a" stroke-width="0.9"/>
            <line x1="28" y1="19.5" x2="34" y2="18.5" stroke="#c9889a" stroke-width="0.9"/>
            <line x1="28" y1="21" x2="34" y2="21.5" stroke="#c9889a" stroke-width="0.9"/>
          </svg>
          <div class="info">
            <div class="t">小克</div>
            <div class="s">· 在线 ·</div>
          </div>
          <div class="greet" id="greeting">晚上好 ✦</div>
        </div>

        <!-- Brief card -->
        <div class="card">
          <div class="brief-head">
            <div class="t">今日简报</div>
            <div class="r" onclick="loadBriefing()">刷新</div>
          </div>
          <div class="brief-body" id="briefing-text">今天是个好日子，记得喝水，早点休息。我在这里等你～</div>
        </div>

        <!-- 4 feature cards -->
        <div class="feature-grid">
          <div class="card feature-card" onclick="switchPage('chat')">
            <svg width="26" height="26" viewBox="0 0 22 22" fill="none"><path d="M4 4H18C19.1 4 20 4.9 20 6V14C20 15.1 19.1 16 18 16H7L3 20V6C3 4.9 3.9 4 4 4Z" stroke="#c9a0ac" stroke-width="1.5" fill="none" stroke-linejoin="round"/><circle cx="8" cy="10" r="1" fill="#c9a0ac"/><circle cx="11" cy="10" r="1" fill="#c9a0ac"/><circle cx="14" cy="10" r="1" fill="#c9a0ac"/></svg>
            <div class="lbl">聊天</div>
          </div>
          <div class="card feature-card" onclick="switchPage('dashboard')">
            <svg width="26" height="26" viewBox="0 0 22 22" fill="none"><rect x="3" y="14" width="4" height="5" rx="1" stroke="#c9a0ac" stroke-width="1.5"/><rect x="9" y="10" width="4" height="9" rx="1" stroke="#c9a0ac" stroke-width="1.5"/><rect x="15" y="6" width="4" height="13" rx="1" stroke="#c9a0ac" stroke-width="1.5"/></svg>
            <div class="lbl">设置</div>
          </div>
          <div class="card feature-card" onclick="showPostForm()">
            <svg width="26" height="26" viewBox="0 0 22 22" fill="none"><path d="M11 3C11 3 4 7 4 13C4 16.3 7.1 19 11 19C14.9 19 18 16.3 18 13C18 7 11 3 11 3Z" stroke="#c9a0ac" stroke-width="1.5" fill="none" stroke-linejoin="round"/><path d="M11 8V13L14 15" stroke="#c9a0ac" stroke-width="1.5" stroke-linecap="round"/></svg>
            <div class="lbl">记录</div>
          </div>
          <div class="card feature-card" onclick="switchPage('reader')">
            <svg width="26" height="26" viewBox="0 0 22 22" fill="none"><path d="M11 3L13.5 8.5L19.5 9.3L15 13.6L16.2 19.5L11 16.7L5.8 19.5L7 13.6L2.5 9.3L8.5 8.5L11 3Z" stroke="#c9a0ac" stroke-width="1.5" fill="none" stroke-linejoin="round"/></svg>
            <div class="lbl">回忆</div>
          </div>
        </div>

        <!-- Recent memory -->
        <div class="card">
          <div class="sidebar-label">最近记忆</div>
          <div id="home-posts" style="font-size:13px;color:var(--textFaint);text-align:center;padding:12px 0">还没有记忆，去和我说说话吧～</div>
        </div>

      </div>
    </div>

    <!-- ══ CHAT ══ -->
    <div id="page-chat" class="page" style="display:none">
      <div class="chat-wrap">
        <div class="chat-scroll" id="chat-msgs">
          <div class="date-divider"><span>今天</span></div>
          <div style="text-align:center;color:var(--textFaint);margin-top:36px;font-size:13px">我是小克。有什么想和我说的吗？</div>
        </div>
        <div id="typing" class="typing-indicator" style="display:none">
          <svg width="34" height="34" viewBox="0 0 40 40" fill="none" style="flex-shrink:0"><circle cx="20" cy="20" r="20" fill="#F9E8EC"/><polygon points="11,11 14,4 17,12" fill="#F2C4CE"/><polygon points="29,11 26,4 23,12" fill="#F2C4CE"/><circle cx="20" cy="19" r="9" fill="#F2C4CE"/><circle cx="16.5" cy="18" r="1.4" fill="#7a5c62"/><circle cx="23.5" cy="18" r="1.4" fill="#7a5c62"/></svg>
          <div class="typing-dots"><span></span><span></span><span></span></div>
        </div>
        <div class="chat-input-area">
          <div class="chat-input-row">
            <textarea id="chat-input" rows="1" placeholder="说点什么…"
              onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage()}"></textarea>
            <button id="send-btn" class="send-btn off" onclick="sendMessage()">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 8L14 2L8 14L7 9L2 8Z"/></svg>
            </button>
          </div>
          <div class="hint">🐾 按 Enter 发送</div>
        </div>
      </div>
    </div>

    <!-- ══ SETTINGS ══ -->
    <div id="page-dashboard" class="page" style="display:none">
      <div class="data-wrap">
        <div class="card">
          <div style="font-size:15px;color:var(--textMid);font-style:italic;margin-bottom:16px">个性化设置</div>

          <div class="form-group">
            <label>系统提示词</label>
            <textarea id="set-system-prompt" rows="3" placeholder="定义小克的人格和行为方式…"></textarea>
          </div>

          <div class="form-group">
            <label>Temperature <span id="set-temp-val" style="color:var(--accentLight)">0.7</span></label>
            <input type="range" id="set-temperature" min="0" max="2" step="0.1" value="0.7"
              oninput="document.getElementById('set-temp-val').textContent=this.value">
          </div>

          <div class="form-group">
            <label>最大上下文轮数</label>
            <input type="number" id="set-max-rounds" min="5" max="100" value="30">
          </div>

          <div class="form-group">
            <label>压缩触发阈值 (tokens)</label>
            <input type="number" id="set-compress-threshold" min="1000" max="50000" step="500" value="6000">
          </div>

          <div class="form-group">
            <label>压缩后保留轮数</label>
            <input type="number" id="set-keep-rounds" min="2" max="30" value="10">
          </div>

          <div class="form-group">
            <label>最大回复 Token</label>
            <input type="number" id="set-max-tokens" min="256" max="32768" step="256" value="4096">
          </div>

          <div id="set-msg" style="text-align:center;font-size:12px;margin-bottom:10px;color:var(--accentLight);min-height:18px"></div>

          <button class="btn-save" onclick="saveSettings()">保存设置</button>
        </div>

        <div class="card">
          <div class="data-header">
            <div class="t">今日数据</div>
            <div class="d" id="dashboard-date"></div>
          </div>
          <div class="stat-grid" id="dash-stats"></div>
        </div>
      </div>
    </div>

    <!-- ══ MEMORY ══ -->
    <div id="page-reader" class="page" style="display:none">
      <div class="memory-wrap">
        <div class="card" style="display:flex;justify-content:space-between;align-items:center;padding:14px 18px">
          <div style="font-size:15px;color:var(--textMid);font-style:italic">记忆存档</div>
          <select id="post-filter" onchange="loadPosts()" style="width:auto;padding:6px 10px;font-size:12px;font-family:inherit;border:1px solid var(--border);border-radius:8px;color:var(--textMid);background:var(--bg)">
            <option value="">全部</option><option value="MEMORY">记忆</option><option value="EVENT">事件</option><option value="MOMENT">瞬间</option><option value="PROMISES">承诺</option><option value="WISHLIST">愿望</option>
          </select>
        </div>
        <div id="posts-list"></div>
        <div class="card memory-empty" onclick="showPostForm()" style="cursor:pointer">
          <div style="font-size:13px;color:var(--textFaint)">+ 写下记忆 🐾</div>
        </div>
      </div>
    </div>

  </div><!-- /main-content -->

  <!-- ═══ Bottom nav ═══ -->
  <div id="bottom-nav">
    <button onclick="switchPage('home')" data-nav="home" class="nav-btn active">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><path d="M3 10L11 3L19 10V19H14V14H8V19H3V10Z" stroke="#c47a8a" stroke-width="1.5" fill="#F2C4CE" stroke-linejoin="round"/></svg>
      <span class="nl on">首页</span>
    </button>
    <button onclick="switchPage('chat')" data-nav="chat" class="nav-btn">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><path d="M4 4H18C19.1 4 20 4.9 20 6V14C20 15.1 19.1 16 18 16H7L3 20V6C3 4.9 3.9 4 4 4Z" stroke="#c9a0ac" stroke-width="1.5" fill="none" stroke-linejoin="round"/><circle cx="8" cy="10" r="1" fill="#c9a0ac"/><circle cx="11" cy="10" r="1" fill="#c9a0ac"/><circle cx="14" cy="10" r="1" fill="#c9a0ac"/></svg>
      <span class="nl dim">聊天</span>
    </button>
    <button onclick="switchPage('reader')" data-nav="reader" class="nav-btn">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><path d="M11 3C11 3 4 7 4 13C4 16.3 7.1 19 11 19C14.9 19 18 16.3 18 13C18 7 11 3 11 3Z" stroke="#c9a0ac" stroke-width="1.5" fill="none" stroke-linejoin="round"/><path d="M11 8V13L14 15" stroke="#c9a0ac" stroke-width="1.5" stroke-linecap="round"/></svg>
      <span class="nl dim">回忆</span>
    </button>
    <button onclick="switchPage('dashboard')" data-nav="dashboard" class="nav-btn">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><rect x="3" y="14" width="4" height="5" rx="1" fill="none" stroke="#c9a0ac" stroke-width="1.5"/><rect x="9" y="10" width="4" height="9" rx="1" fill="none" stroke="#c9a0ac" stroke-width="1.5"/><rect x="15" y="6" width="4" height="13" rx="1" fill="none" stroke="#c9a0ac" stroke-width="1.5"/></svg>
      <span class="nl dim">设置</span>
    </button>
  </div>

</div><!-- /app-shell -->

<script src="/js/app.js"></script>
</body>
</html>
