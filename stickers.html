<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a1a2e">
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/css/app.css">
<title>🖼 贴纸 — 小克</title>
</head>
<body>
<div class="page-header">
  <span>🖼 贴纸板</span>
  <button onclick="document.getElementById('upload').click()" class="primary" style="font-size:13px;padding:6px 12px">+ 上传</button>
  <input type="file" id="upload" accept="image/*" style="display:none" onchange="up()">
</div>

<!-- 标签筛选栏 -->
<div id="tag-bar" style="display:flex;overflow-x:auto;gap:6px;padding:8px 16px;-webkit-overflow-scrolling:touch">
  <button onclick="filter('全部')" class="tag-chip active" style="flex-shrink:0;padding:4px 14px;border-radius:16px;border:1px solid var(--border);background:var(--accent);color:#fff;font-size:12px;cursor:pointer;white-space:nowrap">全部</button>
</div>

<div id="grid" style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 16px"></div>
<a href="/" style="display:block;text-align:center;padding:16px;color:var(--accent)">← 返回</a>

<script>
const API="";
let stickers=[],activeTag="全部";

function load(){
  fetch(API+"/api/stickers").then(r=>r.json()).then(d=>{
    stickers=d.stickers||[];
    // 提取所有不重复标签
    const tags=["全部",...new Set(stickers.map(s=>s.tag||"日常"))];
    document.getElementById("tag-bar").innerHTML=tags.map(t=>{
      const active=t===activeTag;
      return`<button onclick="filter('${esc(t)}')" class="tag-chip" style="flex-shrink:0;padding:4px 14px;border-radius:16px;border:1px solid var(--border);background:${active?'var(--accent)':'var(--bg-card)'};color:${active?'#fff':'var(--text-dim)'};font-size:12px;cursor:pointer;white-space:nowrap">${esc(t)}</button>`;
    }).join("");
    filter(activeTag);
  });
}

function filter(tag){
  activeTag=tag||"全部";
  const filtered=activeTag==="全部"?stickers:stickers.filter(s=>(s.tag||"日常")===activeTag);
  document.getElementById("grid").innerHTML=filtered.length?filtered.map(s=>`
    <div style="background:var(--bg-card);border-radius:8px;padding:6px;text-align:center;border:1px solid var(--border);position:relative">
      <button onclick="del(${s.id})" style="position:absolute;top:2px;right:4px;background:rgba(0,0,0,0.5);color:#fff;border:none;border-radius:50%;width:20px;height:20px;font-size:11px;line-height:18px;cursor:pointer;z-index:1">✕</button>
      <img src="${esc(s.url)}" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:4px" loading="lazy">
      <div style="font-size:10px;color:var(--accent);margin-top:3px">${esc(s.tag||"日常")}</div>
      <div style="font-size:11px;color:var(--text-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(s.description||"")}</div>
    </div>
  `).join(""):"<div style='grid-column:1/-1;text-align:center;color:var(--text-dim);padding:40px;font-size:14px'>暂无贴纸，点击右上角上传</div>";

  // 更新标签高亮
  document.querySelectorAll("#tag-bar .tag-chip").forEach(b=>{
    const isActive=b.textContent===activeTag;
    b.style.background=isActive?"var(--accent)":"var(--bg-card)";
    b.style.color=isActive?"#fff":"var(--text-dim)";
  });
}

function del(id){
  if(!confirm("确定删除这张贴纸？"))return;
  fetch(API+"/api/stickers/"+id,{method:"DELETE"}).then(()=>load());
}

function up(){
  const f=document.getElementById("upload").files[0];
  if(!f)return;
  const reader=new FileReader();
  reader.onload=function(){
    const tag=prompt("给这张贴纸打个标签吧（如：撒娇、日常、得意）","日常")||"日常";
    const desc=prompt("简短描述（可选）","")||"";
    fetch(API+"/api/stickers/upload",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({file:reader.result,tag,description:desc})
    }).then(()=>load());
  };
  reader.readAsDataURL(f);
}

function esc(s){const d=document.createElement("div");d.textContent=s;return d.innerHTML}

load();
</script>
</body>
</html>
